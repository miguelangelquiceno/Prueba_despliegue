
steps:
  despliegue:
    image: alpine:3.21
    commands:
      - "find /deploy -mindepth 1 -maxdepth 1 -exec rm -rf {} +"
      - "cp -a sitio/. /deploy/"
      - "echo Despliegue completado correctamente"
    volumes:
      - woodpecker-production:/deploy
    when:
      - event: push
        branch: main
